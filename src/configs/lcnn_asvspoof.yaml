defaults:
  - model: lcnn
  - writer: wandb
  - metrics: asvspoof
  - datasets: asvspoof
  - dataloader: asvspoof
  - transforms: asvspoof
  - _self_

optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4
  betas: [0.9, 0.999]
  eps: 1e-8

lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  step_size: 5000
  gamma: 0.5

loss_function:
  _target_: src.loss.CrossEntropyLoss

trainer:
  log_step: 50
  n_epochs: 100
  epoch_len: 500

  device_tensors:
    - data_object
    - labels

  resume_from: null
  device: auto
  override: false

  monitor: "min dev_EER"
  save_period: 5
  early_stop: ${trainer.n_epochs}
  save_dir: "saved/lcnn_asvspoof_ce"
  seed: 1